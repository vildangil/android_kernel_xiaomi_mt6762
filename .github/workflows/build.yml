name: Certus Kernel Build (SukiSU 3.2.0 + Boot Path Fix)

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="🚀 <b>Запуск сборки $DEVICE</b>%0A🛡️ SukiSU Ultra: 3.2.0%0A📍 Путь: /dev/block/by-name/boot"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python-is-python3 unzip ca-certificates

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Patch with SukiSU Ultra 3.2.0
        run: |
          echo "💉 Интегрируем SukiSU Ultra версии 3.2.0..."
          # Скрипт качаем из main, а ему передаем нужный тег (скорее всего v3.2.0)
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.0

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          
          # Фикс путей для MTK
          CURRENT_DIR=$(pwd)
          ln -s "$CURRENT_DIR/tools" "$CURRENT_DIR/../tools" || true
          chmod -R +x tools/
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE="$CURRENT_DIR/tc32/bin/arm-linux-gnueabi-"
          export KCPPFLAGS="-D_GNU_SOURCE"
          export PATH="$CURRENT_DIR/tools/dct:$PATH"

          mkdir -p out
          make O=out $DEFCONFIG
          
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            END=$(date +"%s")
            DIFF=$((END - START))
            
            echo "📦 Настройка AnyKernel3..."
            wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
            unzip -q ak3.zip && mv AnyKernel3-master ak3
            
            # ИСПРАВЛЕНИЕ ПУТИ И КОНФИГА ANYKERNEL
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
            # Указываем точный путь к разделу boot
            sed -i 's|block=/dev/block/platform/.*/by-name/boot;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
            # Если в шаблоне строка выглядит иначе, принудительно заменяем переменную block
            sed -i 's|^block=.*;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh

            # Копируем ядро
            if [ -f out/arch/arm/boot/zImage-dtb ]; then
                cp out/arch/arm/boot/zImage-dtb ak3/zImage
            else
                cp out/arch/arm/boot/zImage ak3/zImage
            fi
            
            cd ak3 && zip -r9 ../${DEVICE}-Suki-3.2.0.zip * && cd ..
            
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="✅ <b>Сборка готова!</b>%0A🛡️ SukiSU 3.2.0 интегрирован.%0A⏳ Время: $((DIFF / 60))м"
            
            curl -F chat_id="${CHAT_ID}" -F document=@"${DEVICE}-Suki-3.2.0.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            cp build.log build_log.txt
            curl -F chat_id="${CHAT_ID}" -F document=@"build_log.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            cp build.log build_err.txt
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ Ошибка сборки."
            curl -F chat_id="${CHAT_ID}" -F document=@"build_err.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            exit 1
          fi
