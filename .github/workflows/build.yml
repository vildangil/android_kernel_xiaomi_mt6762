name: Certus Kernel Build (SukiSU + AnyKernel3)

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" -d text="🚀 <b>Запуск сборки $DEVICE</b>%0A🛡️ Патч: SukiSU Ultra%0A📦 Пакет: AnyKernel3"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Patch with SukiSU Ultra
        run: |
          echo "💉 Применяем патчи SukiSU Ultra..."
          git clone https://github.com/SukiDevs/SukiSU_Ultra.git suki
          chmod +x suki/patch.sh
          # Запускаем патчер (убедись, что путь к ядру верный, обычно это корень '.')
          ./suki/patch.sh . 

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          chmod -R +x tools/
          
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"
          export PATH=$(pwd)/tools/dct:$PATH

          mkdir -p out
          make O=out $DEFCONFIG
          
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            END=$(date +"%s")
            DIFF=$((END - START))
            
            # Подготовка AnyKernel3
            echo "📦 Упаковка в AnyKernel3..."
            git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git ak3
            # Удаляем лишнее из AnyKernel3
            rm -rf ak3/.git ak3/README.md
            
            # Копируем собранное ядро (zImage или zImage-dtb)
            if [ -f out/arch/arm/boot/zImage-dtb ]; then
                cp out/arch/arm/boot/zImage-dtb ak3/zImage
            elif [ -f out/arch/arm/boot/zImage ]; then
                cp out/arch/arm/boot/zImage ak3/zImage
            fi
            
            # Создаем ZIP
            cd ak3 && zip -r9 ../${DEVICE}-Kernel.zip * && cd ..
            
            # Успешное уведомление
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="✅ <b>Сборка завершена!</b>%0A⏳ Время: $((DIFF / 60))м $((DIFF % 60))с"
            
            # Отправка готового архива
            curl -F chat_id="${CHAT_ID}" -F document=@"${DEVICE}-Kernel.zip" -F caption="AnyKernel3 Flashable ZIP" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            
            # Отправка лога в .txt
            cp build.log build_log.txt
            curl -F chat_id="${CHAT_ID}" -F document=@"build_log.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            cp build.log build_error_log.txt
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ Ошибка компиляции."
            curl -F chat_id="${CHAT_ID}" -F document=@"build_error_log.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="⚠️ Воркфлоу упал на этапе подготовки."
