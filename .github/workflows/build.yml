name: Certus Kernel Build (ARM 32-bit)

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="🚀 <b>Запуск сборки $DEVICE (32-bit)</b>%0A🛡️ SukiSU: v3.2.0%0A📍 AK3: /dev/block/by-name/boot"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Patch SukiSU Ultra 3.2.0
        run: |
          echo "💉 Интегрируем SukiSU Ultra v3.2.0..."
          # Качаем из main, чтобы избежать 404, и ставим тег v3.2.0
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.0

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          
          # 1. Исправления для инструментов
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          chmod -R +x tools/
          
          # 2. ПЕРЕИМЕНОВАНИЕ И ВКЛЮЧЕНИЕ SUKISU
          # Путь к твоему дефконфигу (раз ARCH=arm)
          CONF_PATH=arch/arm/configs/${{ env.DEFCONFIG }}
          
          # Устанавливаем имя ядра (добавится в конец версии)
          # Важно: имя должно начинаться с дефиса и не содержать пробелов
          echo 'CONFIG_LOCALVERSION="-SukaKernel"' >> $CONF_PATH
          
          # Принудительно включаем поддержку SukiSU в конфиге
          echo "CONFIG_KSU=y" >> $CONF_PATH
          # Для работы хуков SukiSU на старых ядрах часто нужны эти параметры:
          echo "CONFIG_TRACEPOINTS=y" >> $CONF_PATH
          echo "CONFIG_STAGING=y" >> $CONF_PATH
          
          # 3. Окружение
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"
          export PATH=$(pwd)/tools/dct:$PATH

          # 4. Сборка
          mkdir -p out
          make O=out $DEFCONFIG
          
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            # ... далее остальной код упаковки AnyKernel3 из твоего скрипта ...

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="⚠️ Воркфлоу прерван на раннем этапе (зависимости или тулчейн)."
