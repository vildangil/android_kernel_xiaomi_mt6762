name: Certus Kernel Build (ARM 32-bit)

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="🚀 <b>Запуск сборки $DEVICE (32-bit)</b>%0A🛡️ SukiSU: v3.2.0%0A📍 AK3: /dev/block/by-name/boot"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Patch SukiSU Ultra 3.2.0
        run: |
          echo "💉 Интегрируем SukiSU Ultra v3.2.0..."
          # Качаем из main, чтобы избежать 404, и ставим тег v3.2.0
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.0

      - name: Build Kernel
        run: |
          # Останавливаем всё при любой ошибке
          set -e
          
          START=$(date +"%s")
          
          # 1. Фиксы для инструментов
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          chmod -R +x tools/
          
          # 2. ПЕРЕИМЕНОВАНИЕ И КОНФИГ
          CONF_PATH=arch/arm/configs/${{ env.DEFCONFIG }}
          
          # Ставим твоё название (SukaKernel)
          echo 'CONFIG_LOCALVERSION="-SukaKernel"' >> $CONF_PATH
          
          # Включаем нужные параметры для SukiSU
          echo "CONFIG_KSU=y" >> $CONF_PATH
          echo "CONFIG_TRACEPOINTS=y" >> $CONF_PATH
          echo "CONFIG_STAGING=y" >> $CONF_PATH
          
          # 3. Интеграция SukiSU
          echo "💉 Интегрируем SukiSU Ultra..."
          # Используем main, чтобы не ловить 404, это самая стабильная точка входа
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # 4. ХАК ДЛЯ ЯДРА 4.9 (Убираем MODULE_IMPORT_NS)
          # Этот макрос не поддерживается в 4.9 и вызывает ошибку компиляции
          if [ -f drivers/kernelsu/ksu.c ]; then
            echo "🛠️ Фиксим несовместимость кода с ядром 4.9..."
            sed -i 's/MODULE_IMPORT_NS.*//g' drivers/kernelsu/ksu.c
          fi

          # 5. Окружение
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"
          export PATH=$(pwd)/tools/dct:$PATH

          # 6. Сборка
          mkdir -p out
          make O=out $DEFCONFIG
          
          # Запускаем компиляцию
          make -j$(nproc --all) O=out 2>&1 | tee build.log
          
          END=$(date +"%s")
          DIFF=$((END - START))
          K_VER=$(make O=out kernelversion)
          
          # Успех в Телеграм
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="✅ <b>Готово!</b>%0A📋 $K_VER%0A⏳ $((DIFF / 60))м $((DIFF % 60))с"
          
          # 7. Упаковка (AnyKernel3)
          wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip && mv AnyKernel3-master ak3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          sed -i 's|^block=.*;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
          
          cp out/arch/arm/boot/zImage* ak3/zImage || cp out/arch/arm/boot/Image* ak3/zImage
          
          cd ak3 && zip -r9 ../${DEVICE}-SukaKernel.zip * && cd ..
          
          # Отправка файла и лога
          curl -F chat_id="${CHAT_ID}" -F document=@"${DEVICE}-SukaKernel.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument"
          cp build.log build_log.txt
          curl -F chat_id="${CHAT_ID}" -F document=@"build_log.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="⚠️ Воркфлоу прерван на раннем этапе (зависимости или тулчейн)."
