name: Certus Kernel Build (SukiSU-Ultra Fix)

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="🚀 <b>Запуск сборки $DEVICE</b>%0A🛡️ Интеграция: SukiSU-Ultra (Built-in mode)"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python-is-python3 unzip ca-certificates

      - name: Download Toolchain (Linaro 7.5)
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Patch with SukiSU Ultra
        run: |
          echo "💉 Интегрируем SukiSU Ultra через официальный скрипт..."
          # Используем параметр 'builtin' для лучшей совместимости с MTK ядрами
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s builtin

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          
          # Права на инструменты MTK
          chmod -R +x tools/ || true
          
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"
          export PATH=$(pwd)/tools/dct:$PATH

          mkdir -p out
          make O=out $DEFCONFIG
          
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            END=$(date +"%s")
            DIFF=$((END - START))
            
            echo "📦 Упаковка в AnyKernel3..."
            wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
            unzip -q ak3.zip && mv AnyKernel3-master ak3
            
            sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
            
            # Копируем ядро
            [ -f out/arch/arm/boot/zImage-dtb ] && cp out/arch/arm/boot/zImage-dtb ak3/zImage || cp out/arch/arm/boot/zImage ak3/zImage
            
            cd ak3 && zip -r9 ../${DEVICE}-SukiSU.zip * && cd ..
            
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="✅ <b>Готово!</b>⏳ $((DIFF / 60))м $((DIFF % 60))с"
            
            curl -F chat_id="${CHAT_ID}" -F document=@"${DEVICE}-SukiSU.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            cp build.log build_log.txt
            curl -F chat_id="${CHAT_ID}" -F document=@"build_log.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            cp build.log build_error.txt
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ Ошибка сборки."
            curl -F chat_id="${CHAT_ID}" -F document=@"build_error.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            exit 1
          fi
