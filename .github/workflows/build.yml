name: Certus Kernel Build (ARM 32-bit)

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" -d text="🚀 <b>Запуск 32-битной сборки $DEVICE!</b>"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 unzip ca-certificates

      - name: Download Toolchain (ARM 32-bit)
        run: |
          mkdir -p tc32
          echo "📥 Скачиваем GCC 32-bit Linaro 7.5..."
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          
          # Ключевые изменения для 32-битной сборки:
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"

          mkdir -p out
          make O=out $DEFCONFIG
          
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            END=$(date +"%s")
            DIFF=$((END - START))
            K_VER=$(make O=out kernelversion)
            
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="✅ <b>32-bit ядро собрано!</b>%0A📋 $K_VER%0A⏳ $((DIFF / 60))м $((DIFF % 60))с"
            
            # В 32-битных ARM результат обычно zImage, zImage-dtb или uImage
            # Ищем любые файлы в папке boot
            find out/arch/arm/boot -name "*Image*" -type f -exec curl -F chat_id="${CHAT_ID}" -F document=@{} "https://api.telegram.org/bot${TOKEN}/sendDocument" \;
            
            zip -q build_log.zip build.log
            curl -F chat_id="${CHAT_ID}" -F document=@"build_log.zip" -F caption="Лог сборки" "https://api.telegram.org/bot${TOKEN}/sendDocument"
          else
            zip -q build_log.zip build.log
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ Ошибка компиляции 32-bit ядра."
            curl -F chat_id="${CHAT_ID}" -F document=@"build_log.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="⚠️ Сборка прервана на этапе подготовки."
