name: SukaKernel

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig
  ARCH: arm
  # Путь к тулчейну будет добавлен в шаге сборки

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Script started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="Скрипт запущен" -d parse_mode="HTML"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates \
          cpio lz4 libncurses5-dev
          # Важно для старых скриптов MTK
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-*.tar.xz -C tc32 --strip-components=1

      - name: echo ksu
        run: |
          echo "CONFIG_KSU=y" >> arch/arm/configs/$DEFCONFIG
          echo "CONFIG_KSU_SUKI=y" >> arch/arm/configs/$DEFCONFIG
          echo "CONFIG_OVERLAY_FS=y" >> arch/arm/configs/$DEFCONFIG
          echo "CONFIG_PROFILING=y" >> arch/arm/configs/$DEFCONFIG

      - name: Integrate SukiSU
        env:
          # Убедись, что ты создал секрет GH_PAT в настройках репозитория!
          GH_TOKEN: ${{ secrets.GH_PAT }} 
        run: |
          # 1. Очистка старых следов
          rm -rf drivers/kernelsu
          rm -rf tmp_ksu
          
          # 2. Клонирование с использованием токена
          # Мы используем переменную GH_TOKEN, которую объявили выше в env
          git clone "https://x-access-token:${GH_TOKEN}@github.com/5ec1cff/SukiSU.git" tmp_ksu
          
          # 3. Переход на нужную ветку и перенос файлов
          cd tmp_ksu && git checkout main && cd ..
          mv tmp_ksu/kernel drivers/kernelsu
          rm -rf tmp_ksu

          # 4. Проверка, что файл на месте
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo "❌ Ошибка: Файл drivers/kernelsu/Kconfig не найден!"
            exit 1
          fi

          # 5. Интеграция в дерево сборки
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi
          echo "✅ SukiSU успешно интегрирован"

      - name: Build Kernel
        run: |
          export PATH=$(pwd)/tc32/bin:$PATH
          export CROSS_COMPILE=arm-linux-gnueabi-
          export ARCH=arm

          # Уведомление в Telegram
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="🚀 Сборка <b>SukaKernel</b> начата..." -d parse_mode="HTML"

          # Подготовка
          make O=out mrproper
          make O=out $DEFCONFIG

          # Принудительная установка параметров через штатный скрипт ядра
          # Это гарантирует, что название будет "SukaKernel" и KSU включится
          ./scripts/config --file out/.config --set-str LOCALVERSION "-SukaKernel"
          ./scripts/config --file out/.config --enable CONFIG_KSU
          ./scripts/config --file out/.config --enable CONFIG_KSU_SUKI
          ./scripts/config --file out/.config --enable CONFIG_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
          ./scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS

          # Обновляем конфиг, чтобы подтянуть зависимости для SukiSU
          make O=out ARCH=arm olddefconfig

          # Сборка
          if make -j$(nproc --all) O=out ARCH=arm; then
            echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ <b>Ошибка сборки SukaKernel</b>" -d parse_mode="HTML"
            exit 1
          fi

      - name: Package and Upload
        if: env.BUILD_SUCCESS == 'true'
        run: |
          # Подготовка AnyKernel3
          wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip && mv AnyKernel3-master ak3
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          sed -i 's|^block=.*;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
          
          # Проверка наличия образа (zImage или zImage-dtb)
          if [ -f out/arch/arm/boot/zImage-dtb ]; then
            cp out/arch/arm/boot/zImage-dtb ak3/zImage
          elif [ -f out/arch/arm/boot/zImage ]; then
            cp out/arch/arm/boot/zImage ak3/zImage
          else
            echo "❌ Ядро не найдено!"
            exit 1
          fi
          
          cd ak3 && zip -r9 ../${DEVICE}-SukaKernel.zip * && cd ..

      - name: Send to Telegram
        if: env.BUILD_SUCCESS == 'true'
        run: |
          # Проверяем, существует ли файл перед отправкой
          if [ -f "${DEVICE}-SukaKernel.zip" ]; then
            curl -v -F document=@"${DEVICE}-SukaKernel.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument?chat_id=${CHAT_ID}&caption=✅+Сборка+${DEVICE}+завершена!"
          else
            echo "❌ Файл архива не найден, отправка отменена."
            exit 1
          fi
