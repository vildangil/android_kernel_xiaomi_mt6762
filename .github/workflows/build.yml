name: SukaKernel

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="🚀 <b>Запуск сборки SukaKernel</b>%0A🛡️ SukiSU: v3.2.0%0A📍 AK3: /dev/block/by-name/boot"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Patch SukiSU Ultra 3.2.0
        run: |
          echo "💉 Интегрируем SukiSU Ultra v3.2.0..."
          # Качаем из main, чтобы избежать 404, и ставим тег v3.2.0
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s v3.2.0

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          
          # 1. Инструменты
          sudo ln -sf /usr/bin/python3 /usr/bin/python
          chmod -R +x tools/
          
          # 2. НАСТРОЙКА КОНФИГА
          CONF_PATH=arch/arm/configs/${{ env.DEFCONFIG }}
          echo "🛠️ Настройка конфига: $CONF_PATH"
          
          # Чистим старые записи и задаем имя ядра
          sed -i '/CONFIG_LOCALVERSION=/d' $CONF_PATH || true
          echo 'CONFIG_LOCALVERSION="-SukaKernel"' >> $CONF_PATH
          
          # Принудительно включаем KSU и зависимости
          for opt in CONFIG_KSU CONFIG_TRACEPOINTS CONFIG_STAGING; do
            sed -i "/$opt=/d" $CONF_PATH || true
            echo "$opt=y" >> $CONF_PATH
          done
          
          # 3. ИНТЕГРАЦИЯ SUKISU
          echo "💉 Загрузка SukiSU Ultra..."
          curl -L https://github.com/SukiSU-Ultra/SukiSU-Ultra/archive/refs/heads/main.zip -o suki.zip
          unzip -q suki.zip
          SUKI_SRC=$(find . -maxdepth 1 -type d -name "SukiSU-Ultra*" | head -n 1)
          
          mkdir -p drivers/kernelsu
          cp -rf $SUKI_SRC/kernel/* drivers/kernelsu/
          
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo "obj-y += kernelsu/" >> drivers/Makefile
          fi
          
          # 4. ЖЕСТКИЕ ФИКСЫ ДЛЯ ЯДРА 4.9
          echo "🛠️ Применяем патчи для 4.9..."
          # Выключаем строгую проверку ошибок (превращение warning в error)
          sed -i 's/-Werror//g' drivers/kernelsu/Makefile || true
          
          # Фикс 1: Убираем MODULE_IMPORT_NS
          find drivers/kernelsu/ -type f -name "*.c" -exec sed -i 's/MODULE_IMPORT_NS.*//g' {} +
          
          # Фикс 2: Исправляем ошибку unknown type name ‘syscall_fn_t’
          if [ -f drivers/kernelsu/syscall_hook.h ]; then
            sed -i 's/syscall_fn_t/void*/g' drivers/kernelsu/syscall_hook.h
          fi
          
          # Фикс 3: Принудительное приведение типов для kernel_write
          # Меняем kernel_write(fp, &variable, ...) на kernel_write(fp, (const char *)&variable, ...)
          sed -i 's/kernel_write(\([^,]*\), &\([^,]*\)/kernel_write(\1, (const char *)\&\2/g' drivers/kernelsu/allowlist.c || true
          
          # Фикс 4: Удаляем параметр TWA_RESUME из task_work_add, так как в 4.9 эта функция принимает только два аргумента
          sed -i 's/, TWA_RESUME//g' drivers/kernelsu/allowlist.c || true

          # 5. ОКРУЖЕНИЕ
          export ARCH=arm
          export SUBARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"
          export PATH=$(pwd)/tools/dct:$PATH

          # 6. СБОРКА
          mkdir -p out
          make O=out $DEFCONFIG
          
          echo "🚀 Начинаем компиляцию..."
          if ! make -j4 O=out 2>&1 | tee build.log; then
            echo "❌ ОШИБКА СБОРКИ! Последние строки:"
            tail -n 60 build.log
            exit 1
          fi
          
          END=$(date +"%s")
          DIFF=$((END - START))
          K_VER=$(make O=out kernelversion)
          
          # 7. УПАКОВКА
          echo "📦 Упаковка в AnyKernel3..."
          wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip && mv AnyKernel3-master ak3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          sed -i 's|^block=.*;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
          
          # Ищем ядро
          if [ -f out/arch/arm/boot/zImage-dtb ]; then
            cp out/arch/arm/boot/zImage-dtb ak3/zImage
          else
            cp out/arch/arm/boot/zImage ak3/zImage
          fi
          
          cd ak3 && zip -r9 ../${DEVICE}-SukaKernel.zip * && cd ..
          
          # 8. ТЕЛЕГРАМ
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
          -d text="✅ <b>Ядро SukaKernel собрано!</b>%0A📋 Версия: $K_VER%0A⏳ Время: $((DIFF / 60))м $((DIFF % 60))с"
          
          curl -F chat_id="${CHAT_ID}" -F document=@"${DEVICE}-SukaKernel.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument"
          cp build.log build_log.txt
          curl -F chat_id="${CHAT_ID}" -F document=@"build_log.txt" "https://api.telegram.org/bot${TOKEN}/sendDocument"

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="⚠️ Воркфлоу прерван на раннем этапе (зависимости или тулчейн)."
