name: SukaKernel

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates \
          cpio lz4 libncurses5-dev
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-*.tar.xz -C tc32 --strip-components=1

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          export ARCH=arm
          export CROSS_COMPILE=$(pwd)/tc32/bin/arm-linux-gnueabi-
          
          # 1. Чистая установка SukiSU v3.2.0
          # Удаляем старые попытки, чтобы не было конфликтов
          rm -rf drivers/kernelsu
          
          # Клонируем версию 3.2.0
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git -b v3.2.0 drivers/kernelsu --depth 1
          
          # ВАЖНО: Запускаем скрипт из КОРНЯ ядра, не переходя в другую папку
          # Это исправит ошибку ""drivers/" directory not found"
          bash drivers/kernelsu/kernel/setup.sh v3.2.0
          
          # 2. Настройка конфига (Имя + KSU)
          # Проверяем, существует ли файл, чтобы не упасть с ошибкой
          CONF_FILE="arch/arm/configs/$DEFCONFIG"
          if [ ! -f "$CONF_FILE" ]; then
            echo "❌ Файл конфига $CONF_FILE не найден! Проверяем содержимое папки configs:"
            ls arch/arm/configs/
            exit 1
          fi
          
          # Удаляем старые записи и добавляем твои
          sed -i '/CONFIG_LOCALVERSION=/d' "$CONF_FILE"
          echo 'CONFIG_LOCALVERSION="-SukaKernel"' >> "$CONF_FILE"
          
          sed -i '/CONFIG_KSU=/d' "$CONF_FILE"
          echo 'CONFIG_KSU=y' >> "$CONF_FILE"
          
          # 3. Компиляция
          mkdir -p out
          make O=out $DEFCONFIG
          
          if ! make -j$(nproc) O=out 2>&1 | tee build.log; then
            echo "❌ Ошибка компиляции!"
            tail -n 50 build.log
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ <b>Ошибка сборки SukaKernel</b>" -d parse_mode="HTML"
            exit 1
          fi
          
          # 4. Упаковка в AnyKernel3
          wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip && mv AnyKernel3-master ak3
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          sed -i 's|^block=.*;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
          
          # Подхватываем ядро (пробуем разные варианты имени файла)
          if [ -f out/arch/arm/boot/zImage-dtb ]; then
            cp out/arch/arm/boot/zImage-dtb ak3/zImage
          else
            cp out/arch/arm/boot/zImage ak3/zImage
          fi
          
          cd ak3 && zip -r9 ../${DEVICE}-SukaKernel.zip * && cd ..
          
          DIFF=$(($(date +"%s") - START))
          curl -s -F document=@"${DEVICE}-SukaKernel.zip" \
          -F caption="✅ <b>SukaKernel (4.9.200) готов!</b>%0A🛡️ SukiSU: v3.2.0%0A⏱ Время: $((DIFF / 60)) мин." \
          -F parse_mode="HTML" \
          "https://api.telegram.org/bot${TOKEN}/sendDocument?chat_id=${CHAT_ID}"
