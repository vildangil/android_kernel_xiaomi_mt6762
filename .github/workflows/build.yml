name: SukaKernel

on:
  workflow_dispatch:

env:
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig
  ARCH: arm
  # Путь к тулчейну будет добавлен в шаге сборки

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Script started
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="Скрипт запущен" -d parse_mode="HTML"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-arm-linux-gnueabi git zip curl wget tar python3 python2 unzip ca-certificates \
          cpio lz4 libncurses5-dev
          # Важно для старых скриптов MTK
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Download Toolchain
        run: |
          mkdir -p tc32
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-*.tar.xz -C tc32 --strip-components=1

      - name: Integrate SukiSU Ultra (ARM32 Final Fix)
        run: |
          # 1. Подготовка
          rm -rf drivers/kernelsu tmp_ksu
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git tmp_ksu
          
          # 2. Определяем, где лежат исходники (в некоторых версиях SukiSU папка называется по-разному)
          if [ -d "tmp_ksu/kernel" ]; then
            mv tmp_ksu/kernel drivers/kernelsu
          else
            mv tmp_ksu drivers/kernelsu
          fi
          rm -rf tmp_ksu

          # 3. ФИКС АРХИТЕКТУРЫ (уже проверено)
          sed -i '/#error "Unsupported arch"/d' drivers/kernelsu/arch.h
          cat <<EOF >> drivers/kernelsu/arch.h
          #if defined(__arm__)
          #define ksu_get_syscall_nr(regs) ((regs)->ARM_r7)
          #define ksu_get_first_arg(regs) ((regs)->ARM_r0)
          #define ksu_get_second_arg(regs) ((regs)->ARM_r1)
          #define ksu_get_third_arg(regs) ((regs)->ARM_r2)
          #define ksu_get_fourth_arg(regs) ((regs)->ARM_r3)
          #endif
          EOF

          # 4. ТОТАЛЬНЫЙ ФИКС UID/GID (Решаем ошибку .val во всех файлах)
          # Рекурсивно ищем все .c и .h файлы и удаляем .val
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/\.val//g' {} +
          
          # 5. ФИКС ТИПОВ В allowlist.c
          # Исправляем ошибку "discards qualifiers" (const struct cred)
          if [ -f "drivers/kernelsu/allowlist.c" ]; then
            sed -i 's/fp->f_cred/(struct cred *)fp->f_cred/g' drivers/kernelsu/allowlist.c
          fi

          # 6. Интеграция в Makefile и Kconfig
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # 7. Конфиг KPROBES (критично для работы Root)
          echo "CONFIG_KPROBES=y" >> arch/arm/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm/configs/${{ env.DEFCONFIG }}
          
          echo "✅ Все патчи применены рекурсивно. Начинаем сборку..."
          
      - name: Integrate SukiSU Ultra (ARM32 Absolute Fix)
        run: |
          # 1. Подготовка
          rm -rf drivers/kernelsu tmp_ksu
          git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git tmp_ksu
          
          # 2. Перенос исходников
          if [ -d "tmp_ksu/kernel" ]; then
            mv tmp_ksu/kernel drivers/kernelsu
          else
            mv tmp_ksu drivers/kernelsu
          fi
          rm -rf tmp_ksu

          # 3. Фикс архитектуры (уже работает)
          sed -i '/#error "Unsupported arch"/d' drivers/kernelsu/arch.h
          cat <<EOF >> drivers/kernelsu/arch.h
          #if defined(__arm__)
          #define ksu_get_syscall_nr(regs) ((regs)->ARM_r7)
          #define ksu_get_first_arg(regs) ((regs)->ARM_r0)
          #define ksu_get_second_arg(regs) ((regs)->ARM_r1)
          #define ksu_get_third_arg(regs) ((regs)->ARM_r2)
          #define ksu_get_fourth_arg(regs) ((regs)->ARM_r3)
          #endif
          EOF

          # 4. УЛЬТИМАТИВНЫЙ ФИКС UID/GID (Решаем ошибку .val)
          # Удаляем .val везде: и после точки (uid.val), и после стрелки (uid->val)
          find drivers/kernelsu -type f \( -name "*.c" -o -name "*.h" \) -exec sed -i 's/\.val//g' {} +
          
          # 5. Специфичный фикс для vfs_helper.c и ksu.c
          # Иногда компилятор ругается на прямое сравнение структур, если .val удален
          # Этот патч гарантирует, что типы будут интерпретироваться как простые числа
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/KUIDT_INIT//g' {} +
          find drivers/kernelsu -type f -name "*.c" -exec sed -i 's/KGIDT_INIT//g' {} +

          # 6. Фикс типов в allowlist.c
          if [ -f "drivers/kernelsu/allowlist.c" ]; then
            sed -i 's/fp->f_cred/(struct cred *)fp->f_cred/g' drivers/kernelsu/allowlist.c
          fi

          # 7. Интеграция в дерево
          grep -q "kernelsu" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          if ! grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig; then
            sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          fi

          # 8. Конфиг
          echo "CONFIG_KPROBES=y" >> arch/arm/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm/configs/${{ env.DEFCONFIG }}
          echo "CONFIG_HAVE_KPROBES=y" >> arch/arm/configs/${{ env.DEFCONFIG }}
          
          echo "✅ Все барьеры ARM32 устранены. Запускаем компиляцию."

      - name: Package and Upload
        if: env.BUILD_SUCCESS == 'true'
        run: |
          # Подготовка AnyKernel3
          wget -q https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip && mv AnyKernel3-master ak3
          
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' ak3/anykernel.sh
          sed -i 's|^block=.*;|block=/dev/block/by-name/boot;|g' ak3/anykernel.sh
          
          # Проверка наличия образа (zImage или zImage-dtb)
          if [ -f out/arch/arm/boot/zImage-dtb ]; then
            cp out/arch/arm/boot/zImage-dtb ak3/zImage
          elif [ -f out/arch/arm/boot/zImage ]; then
            cp out/arch/arm/boot/zImage ak3/zImage
          else
            echo "❌ Ядро не найдено!"
            exit 1
          fi
          
          cd ak3 && zip -r9 ../${DEVICE}-SukaKernel.zip * && cd ..

      - name: Send to Telegram
        if: env.BUILD_SUCCESS == 'true'
        run: |
          # Проверяем, существует ли файл перед отправкой
          if [ -f "${DEVICE}-SukaKernel.zip" ]; then
            curl -v -F document=@"${DEVICE}-SukaKernel.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument?chat_id=${CHAT_ID}&caption=✅+Сборка+${DEVICE}+завершена!"
          else
            echo "❌ Файл архива не найден, отправка отменена."
            exit 1
          fi
