name: Certus Kernel Build

on:
  workflow_dispatch:

env:
  # Выносим токены в глобальный конфиг, чтобы они были доступны во всех шагах
  TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
  CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  DEVICE: Certus
  DEFCONFIG: certus_defconfig

jobs:
  kernel-build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Notify Start
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d parse_mode="HTML" -d text="🚀 <b>Сборка $DEVICE запущена!</b>"

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
          build-essential bc bison flex libssl-dev libelf-dev \
          gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
          git zip curl wget tar python3 unzip ca-certificates

      - name: Download Toolchains
        run: |
          mkdir -p tc64 tc32
          # Используем максимально быстрые зеркала
          echo "📥 Скачиваем GCC64..."
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/aarch64-linux-gnu/gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_aarch64-linux-gnu.tar.xz -C tc64 --strip-components=1
          
          echo "📥 Скачиваем GCC32..."
          wget -q https://releases.linaro.org/components/toolchain/binaries/7.5-2019.12/arm-linux-gnueabi/gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz
          tar -xf gcc-linaro-7.5.0-2019.12-x86_64_arm-linux-gnueabi.tar.xz -C tc32 --strip-components=1

      - name: Build Kernel
        run: |
          START=$(date +"%s")
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=$(pwd)/tc64/bin/aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=$(pwd)/tc32/bin/arm-linux-gnueabi-
          export KCPPFLAGS="-D_GNU_SOURCE"

          mkdir -p out
          make O=out $DEFCONFIG
          
          if make -j$(nproc --all) O=out 2>&1 | tee build.log; then
            END=$(date +"%s")
            DIFF=$((END - START))
            K_VER=$(make O=out kernelversion)
            
            # Успех
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d parse_mode="HTML" \
            -d text="✅ <b>Собрано!</b>%0A📋 $K_VER%0A⏳ $((DIFF / 60))м $((DIFF % 60))с"
            
            find out/arch/arm64/boot -name "Image.gz*" -exec curl -F chat_id="${CHAT_ID}" -F document=@{} "https://api.telegram.org/bot${TOKEN}/sendDocument" \;
          else
            # Ошибка компиляции
            zip -q build_log.zip build.log
            curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" -d text="❌ Ошибка при компиляции ядра. Проверь лог."
            curl -F chat_id="${CHAT_ID}" -F document=@"build_log.zip" "https://api.telegram.org/bot${TOKEN}/sendDocument"
            exit 1
          fi

      - name: Notify on Failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
          -d chat_id="${CHAT_ID}" -d text="⚠️ Сборка прервана! Ошибка могла произойти на этапе установки зависимостей или скачивания тулчейна. Проверь вкладку Actions в GitHub."
